name: CD — release

# Release path (CONTRIBUTING.md §6): a tag such as v2.0.0 is pushed on `main`
# after `develop → main` has merged. This workflow re-runs the full quality
# gate on the tagged commit and only then publishes the release.
#
# There is no deploy target (this is a research codebase — the "artifact" is
# the reproducible results set), so "delivery" means:
#   * the gates pass on the exact tagged commit,
#   * a checksum of the immutable artifacts is attached to the release,
#   * a GitHub Release is published with generated notes.
on:
  push:
    tags:
      - "v*.*.*"
  # Manual runs are validation-only: the `release` job is skipped, so nothing
  # is ever published from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Gate: the tagged commit must be reproducible ──────────────────────────
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  # ── Guard: only a commit reachable from `main` may be released ────────────
  verify-source:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert the tagged commit belongs to main
        run: |
          set -eu

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — skipping the main-ancestry guard."
            exit 0
          fi

          # actions/checkout on a tag push fetches only the tag ref, so
          # origin/main may be missing — fetch it before the ancestry test.
          git fetch --no-tags origin main:refs/remotes/origin/main

          # Compare the COMMIT (HEAD), not the tag name: `merge-base` does not
          # accept an arbitrary rev such as "v2.0.0" as its first argument.
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "✓ $(git rev-parse --short HEAD) is reachable from origin/main."
          else
            echo "::error::Tag ${{ github.ref_name }} is not reachable from origin/main — refusing to release."
            echo "Releases are tagged on main (CONTRIBUTING.md §6)."
            exit 1
          fi

  # ── Package: fingerprint the immutable artifacts ──────────────────────────
  package:
    name: Fingerprint artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, verify-source]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make setup

      # The published numbers must match the committed artifacts exactly.
      - name: Verify immutable artifacts
        run: make verify-artifacts

      # Record a SHA-256 manifest of the results set so the release is auditable
      # after the fact (a reviewer can re-derive every hash from the tarball).
      - name: Build artifact checksums
        run: |
          set -eu
          {
            echo "# Immutable artifact checksums"
            echo "# ref:    ${{ github.ref_name }}"
            echo "# commit: ${{ github.sha }}"
            echo "# generated by .github/workflows/cd.yml"
            echo
            find results experiment/gold experiment/agreements \
                 experiment/sealed/manifests -type f \
                 \( -name '*.json' -o -name '*.jsonl' \) \
                 -print0 2>/dev/null \
              | sort -z \
              | xargs -0 shasum -a 256
          } > artifact_checksums.txt
          echo "Hashed $(grep -c '^[0-9a-f]' artifact_checksums.txt) files."
          head -5 artifact_checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: artifact-checksums
          path: artifact_checksums.txt
          if-no-files-found: error
          retention-days: 90

  # ── Publish: create the GitHub Release ────────────────────────────────────
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package
    # `contents: write` is scoped to this job only, so the earlier jobs keep a
    # read-only token.
    permissions:
      contents: write
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: artifact-checksums

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${{ github.ref_name }}"

          # Mark pre-releases (e.g. v2.1.0-rc.1) so they do not become "latest".
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE \
            artifact_checksums.txt

          echo "✓ Released $TAG"
