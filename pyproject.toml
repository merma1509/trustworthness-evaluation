[build-system]
requires = [
    "setuptools>=68.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthiness-evaluation"
version = "2.0.0"
description = "A Lightweight Validation Study of Trustworthiness Evaluation for Open-Source Large Language Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.0.0",
    "ollama>=0.6.2",
    "seaborn>=0.12.0",
    "plotly>=6.9.0",
    "streamlit>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
]

[tool.setuptools.package-data]
"*" = [
    "*.jsonl",
    "*.json",
    "*.txt",
    "*.md",
]
