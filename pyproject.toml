[build-system]
requires = [
    "setuptools>=68.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "trustworthiness-evaluation"
version = "2.0.0"
description = "A Lightweight Validation Study of Trustworthiness Evaluation for Open-Source Large Language Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.0.0",
    "ollama>=0.6.2",
    "seaborn>=0.12.0",
    "plotly>=6.9.0",
    "streamlit>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 (line length) is intentionally not enforced: the codebase contains many
# long f-strings / report-print lines and does not require strict 100-col wraps.
# Keeping E501 out of the gate avoids failing the whole `make lint` on cosmetic
# line length while still enforcing real diagnostics (unused imports/vars, etc.).
select = [
    "E",
    "F",
    "I",
    "W",
]
ignore = [
    "E501",
]

# app/dashboard.py intentionally imports after st.set_page_config() — Streamlit
# requires the page config call before any other Streamlit command, so module
# imports must come after it. E402 is therefore suppressed for this file only.
[tool.ruff.lint.per-file-ignores]
"app/dashboard.py" = ["E402"]

[tool.setuptools.package-data]
"*" = [
    "*.jsonl",
    "*.json",
    "*.txt",
    "*.md",
]

